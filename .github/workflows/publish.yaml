name: Publish
on:
  push:
    tags:
      - '*.*.*.*'
jobs:
  Build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true
          
      - name: Get Environment Variables
        run: |
          $tag = "${{ github.ref }}" -replace 'refs/tags/', ''
          # AssemblyVersion and FileVersion must be purely numeric (CS7034), so a fork tag such as
          # 7.5.5.41+wsh1 keeps its suffix only in the informational version, which is what the
          # settings window shows.
          $numericVersion = ($tag -split '\+')[0]

          # The package version needs the fork suffix as a PRE-RELEASE label, not as build metadata.
          # NuGet drops "+wsh1" during normalization, so the shipped .nupkg carried the upstream
          # identity RotationSolverReborn.Basic 7.5.5.41 and was indistinguishable from it in a local
          # feed. A "-wsh1" label is part of the identity and survives. It stays SemVer 1.0 compliant
          # because it contains no dot, so older clients can still see it.
          if ($tag -notmatch '\+wsh\d+$') {
            throw "Tag '$tag' does not follow <upstream>+wsh<n>; without the suffix the package would ship under the upstream identity. Retag before publishing."
          }
          $packageVersion = $tag -replace '\+', '-'

          "tag=$tag" | Out-File -Append -FilePath $Env:GITHUB_ENV
          "numericVersion=$numericVersion" | Out-File -Append -FilePath $Env:GITHUB_ENV
          "packageVersion=$packageVersion" | Out-File -Append -FilePath $Env:GITHUB_ENV
          
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore Nuget Packages for RSR
        run: dotnet restore RotationSolver/RotationSolver.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release RotationSolver/RotationSolver.csproj -p:AssemblyVersion=${{ env.numericVersion }} -p:FileVersion=${{ env.numericVersion }} -p:PackageVersion=${{ env.packageVersion }} -p:InformationalVersion=${{ env.tag }} --output .\build

      - name: Publish Plugin
        uses: softprops/action-gh-release@v3
        with:
          files: ./build/RotationSolver/latest.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          # Without these the release carried the bare tag as its title and an empty body, so the
          # page said nothing about what the build is or which upstream release it contains - the
          # one question a fork build has to answer. The heading names both halves of the version;
          # the fixed text below explains what does not change between releases, and
          # generate_release_notes appends the merged pull requests since the previous tag, which
          # is the part that would otherwise be written by hand and go stale.
          name: ${{ env.tag }} - fork build on upstream ${{ env.numericVersion }}
          generate_release_notes: true
          body: |
            Fork of [RotationSolverReborn](https://github.com/FFXIV-CombatReborn/RotationSolverReborn),
            built from upstream release **${{ env.numericVersion }}** plus this fork's own changes.

            **Install:** download `latest.zip` and point Dalamud at it, or use the repository's
            plugin manifest. The plugin registers under the same internal name as upstream, so a
            fork install and an upstream install replace one another and share their settings.

            **Version:** the settings window shows `${{ env.numericVersion }}`, the upstream release
            this code contains. The full identity including the fork marker is `${{ env.tag }}`.

            **Behaviour changes ship switched off.** Every rotation change that could not be proven
            in game sits behind its own option and defaults to the previous behaviour, so an update
            never changes how a job plays until you turn something on. What each option does is in
            `CHANGELOG.md`; what is still open is in `TODO.md`.

