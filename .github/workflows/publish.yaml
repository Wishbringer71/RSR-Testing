name: Publish
on:
  push:
    tags:
      - '*.*.*.*'
  # Second entrance, because pushing a tag to this repository is not available from every
  # environment that may need to cut a release: a `git push origin <tag>` can come back with
  # HTTP 403 while a branch push to the same commit goes through, and the repository itself
  # carries no rulesets, so the limit is the credential rather than a repository setting.
  # Dispatching a workflow IS available there, so the release is cut from inside the run.
  # The tag is not pushed by a step - action-gh-release creates it from tag_name and
  # target_commitish below, and only after the build has succeeded. A failed build therefore
  # leaves nothing behind, which matters because a stray tag cannot be deleted from the same
  # restricted environment either.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, <upstream>+wsh<n>, for example 7.5.6.9+wsh1'
        required: true
        type: string
jobs:
  Build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true
          
      - name: Get Environment Variables
        run: |
          # On a tag push the name comes from the ref; on a manual run it comes from the input.
          $tag = "${{ inputs.tag }}"
          if (-not $tag) {
            $tag = "${{ github.ref }}" -replace 'refs/tags/', ''
          }
          # AssemblyVersion and FileVersion must be purely numeric (CS7034), so a fork tag such as
          # 7.5.5.41+wsh1 keeps its suffix only in the informational version, which is what the
          # settings window shows.
          $numericVersion = ($tag -split '\+')[0]

          # The package version needs the fork suffix as a PRE-RELEASE label, not as build metadata.
          # NuGet drops "+wsh1" during normalization, so the shipped .nupkg carried the upstream
          # identity RotationSolverReborn.Basic 7.5.5.41 and was indistinguishable from it in a local
          # feed. A "-wsh1" label is part of the identity and survives. It stays SemVer 1.0 compliant
          # because it contains no dot, so older clients can still see it.
          if ($tag -notmatch '\+wsh\d+$') {
            throw "Tag '$tag' does not follow <upstream>+wsh<n>; without the suffix the package would ship under the upstream identity. Retag before publishing."
          }
          $packageVersion = $tag -replace '\+', '-'

          # A tag push cannot land on a tag that already exists - git refuses it. A manual run can,
          # and action-gh-release would then quietly update the existing release instead of
          # creating one, so the same version would ship twice under one name.
          if ("${{ github.event_name }}" -eq 'workflow_dispatch') {
            $existing = git ls-remote --tags origin "refs/tags/$tag"
            if ($existing) {
              throw "Tag '$tag' already exists. Pick the next number rather than republishing over it."
            }
          }

          "tag=$tag" | Out-File -Append -FilePath $Env:GITHUB_ENV
          "numericVersion=$numericVersion" | Out-File -Append -FilePath $Env:GITHUB_ENV
          "packageVersion=$packageVersion" | Out-File -Append -FilePath $Env:GITHUB_ENV
          
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore Nuget Packages for RSR
        run: dotnet restore RotationSolver/RotationSolver.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release RotationSolver/RotationSolver.csproj -p:AssemblyVersion=${{ env.numericVersion }} -p:FileVersion=${{ env.numericVersion }} -p:PackageVersion=${{ env.packageVersion }} -p:InformationalVersion=${{ env.tag }} --output .\build

      - name: Publish Plugin
        uses: softprops/action-gh-release@v3
        with:
          files: ./build/RotationSolver/latest.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          # Both are needed for the manual entrance and both are harmless on a tag push, where
          # they name the tag that triggered the run and the commit it already points at. On a
          # manual run github.ref is a branch, so without tag_name the action would try to
          # release "refs/heads/main"; target_commitish is what lets it create the tag itself,
          # here and now, on the commit that was just built.
          tag_name: ${{ env.tag }}
          target_commitish: ${{ github.sha }}
