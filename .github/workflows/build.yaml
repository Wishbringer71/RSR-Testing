name: Build
on:
  pull_request:
    branches:
      - main
  # Manual trigger, because the pull_request event leaves main itself unbuilt: once a branch is
  # merged there is no further run, and the only evidence that main compiles is that its tree
  # equals a tree some pull request run already built. That holds, but it stops holding the moment
  # anything lands on main directly.
  workflow_dispatch:
jobs:
  DispatchChain:
    # Separate from Build: needs no .NET and no Dalamud, so it reports in
    # seconds instead of waiting on the full Windows build.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # Full history, because the fork version check asks `git describe` which upstream release
          # this code sits on, and the default checkout is one commit deep.
          fetch-depth: 0

      # ---- 0. Prerequisite: the upstream remote. Five checks read it (commit identities, fixed values, fork
      # version, release note, setting tooltips); it has to come before all of them, whatever their section.
      #
      # Depth alone is not enough: this fork's own remote carries no upstream tags at all, only
      # 7.5.5.41+wsh1 and 7.5.6.1+wsh1, and this environment cannot push tags to fix that. So the
      # release tags have to come from upstream directly, or `git describe` finds nothing to
      # compare against.
      - name: Fetch the upstream release tags
        run: |
          git remote add upstream https://github.com/FFXIV-CombatReborn/RotationSolverReborn.git || true
          git fetch --tags --no-recurse-submodules upstream
          git fetch --no-recurse-submodules upstream main

      # ---- 1. The code: does it parse, and do the rules keep their invariants. Each reads the C# the plugin is built from
      # and stands for a defect class that happened here (its comment names it).

      # First, because it is the cheapest answer to the most expensive failure: a file that does not
      # parse fails the Windows build after a minute and a half, and there is no local .NET here to
      # catch it sooner. A move that left two method bodies without their signatures cost exactly
      # that round trip.
      - name: Check the C# files are structurally intact
        run: python3 .github/scripts/audit/check_cs_structure.py

      # MSBuild imports these before compiling anything, so a parse error fails every project.
      # Catching it here costs a second; the same finding in the Windows job costs a minute.
      - name: Check the MSBuild files are well-formed XML
        run: python3 .github/scripts/audit/check_msbuild_xml.py

      - name: Check base call targets
        run: python3 .github/scripts/check_base_calls.py

      # The heal target ranking is upstream code with one fork change in it: a critical rank ahead of
      # the three role short-cuts. Nothing fails when that order is lost - a merge bringing the
      # upstream version back would just quietly pass the dying member over again.
      - name: Check the heal target order
        run: python3 .github/scripts/audit/check_heal_target_order.py

      # "Heal ahead of incoming damage" promises that every healing threshold reads the forecast
      # health. A job threshold on the plain value compiles the same and behaves the same with the
      # setting off, so only this keeps a new one from slipping back (A191).
      - name: Check the healing thresholds read the forecast
        run: python3 .github/scripts/audit/check_heal_threshold_forecast.py

      # NoNeedHealingInvuln is true while NO invulnerability is up; its name reads the other way round.
      # Three callers read it negated and chose only the protected, each silent in play - the last one
      # sent the Warrior's Nascent Flash to invulnerable tanks alone (A226).
      - name: Check NoNeedHealingInvuln is read with the right polarity
        run: python3 .github/scripts/audit/check_invuln_polarity.py

      # A target override replaces that whole ranking with one sort, and the two sorts answer
      # different questions: points say who does not survive the next hit, shares say who is furthest
      # from safe. Where the action's own effect text names a percentage threshold, the game works in
      # shares and a points sort can pick a target the follow-up effect never triggers on. Summoner's
      # Rekindle was exactly that case and nothing failed over it.
      - name: Check the heal target measure matches the action
        run: python3 .github/scripts/audit/check_heal_target_measure.py

      # The once-per-cooldown full heal has to be tied to actual danger, or it goes out on whoever
      # happens to stand lowest - a player who was just raised, most visibly - and is missing when a
      # tank needs it. Nothing fails when the condition is lost; an upstream merge simply brings the
      # unguarded branch back.
      - name: Check the emergency heal asks whether the target is in danger
        run: python3 .github/scripts/audit/check_emergency_heal_threat.py

      # Fails when a barrier whose PvE action creates one is missing from ShieldStatus. That list
      # ages by omission: an unlisted barrier counts as none at all, so the gap is invisible in the
      # code and only shows as a healer topping up a target that was already covered.
      - name: Check ShieldStatus covers every PvE barrier
        run: python3 .github/scripts/audit/scan13.py

      # Fails when the GCD path picks an ability inside the window the execution gate refuses.
      # Nothing fails at runtime when it does - the action shows up in the preview and is silently
      # never cast - so only a static check notices. That is how raising stayed broken for over a
      # year after a gate was added elsewhere.
      - name: Check no GCD selection collides with the execution gate
        run: python3 .github/scripts/audit/scan17.py

      # The stored action lists are sets and have to be asked with Contains. All four were walked
      # with a foreach instead, four of the five sites upstream code, and the area list ships with
      # 850 entries - so the cost of one membership question grew with the list. Nothing fails when
      # the loop returns; only frame time changes.
      - name: Check the stored action lists are looked up, not walked
        run: python3 .github/scripts/audit/check_set_lookups.py

      # A stored list is written back whole on every save, so one that is never loaded destroys its
      # own file on the first save of the session. That happened to the learned damage potentials:
      # the load line went into the Init nobody calls, and what several evenings of pulls had rated
      # was gone at the next login. Nothing throws, nothing is logged, and in the fight it looks
      # like the measurement simply never does much.
      - name: Check every saved list is loaded on the path that runs
        run: python3 .github/scripts/audit/check_config_store_roundtrip.py

      # A setting with a label and a default promises the user it does something. When nothing
      # reads it the promise fails silently and forever. Two such settings sat in the raise path
      # alone, so this guards against the next one rather than against those two.
      - name: Check every user setting has a reader
        run: python3 .github/scripts/audit/scan18.py

      # The sibling of the check below: that one asks whether a setting is read at all, this one
      # whether the user can tell what it does. A fork setting with no explanation leaves them
      # guessing what a slider does to their fight, and for the rotation settings a missing tooltip
      # also means the "(?)" marker is never drawn - so there is nothing to hover and no sign that
      # an explanation was ever intended. Nothing fails when one is added without it.
      - name: Check every fork setting explains its effect in the fight
        run: python3 .github/scripts/audit/check_setting_tooltips.py

      # The owner's rule: no fixed values in the code, everything derived from the game, and an
      # exception only after a loop that asked whether the game can supply the value after all.
      # Every number on a line the fork added has to be listed - as an exception with its loop in
      # AUDIT_LOG.md, or as a loop still open. A new number listed nowhere fails here.
      - name: Check no fixed value entered without a loop
        run: python3 .github/scripts/audit/check_fixed_values.py

      # ---- 2. Generated files and game data: what the code takes from the game sheets and from upstream's lists.

      # What a defensive action takes off a hit is stated in its own effect text and generated into
      # DefensiveValues.g.cs. Checked rather than trusted: the generated file is committed, so a
      # game patch that restates a figure, or a parser that quietly stops matching, would otherwise
      # leave a stale table behind that nothing reads as wrong.
      - name: Check the generated defensive values still match the effect texts
        run: python3 .github/scripts/audit/generate_defensive_values.py --check

      # The per-job action dependency matrix (concept 14) is generated from the same sheets and from
      # the rotations. A rotation change or an upstream sync that is not followed by a regeneration
      # would leave a matrix that says what the code no longer does.
      - name: Check the action dependency matrix is up to date
        run: python3 .github/scripts/audit/generate_action_matrix.py --check

      # The user plays a German client, so every name he states has to be translated back to an
      # identifier before anything can be searched for. Getting that wrong has produced both a false
      # "not in the tree" report and an invented German name, so the pairs are recorded rather than
      # looked up again; this keeps each one pointing at something that exists and holds its German
      # name against the game's German sheets (xivapi), skipping that part when xivapi is unreachable.
      - name: Check the German action-name dictionary resolves
        run: python3 .github/scripts/audit/check_action_names.py

      # ---- 3. The documents: concepts and release text against the code and against each other.

      # A line reference is the cheapest way to make a concept verifiable and the first thing to
      # rot, because any edit above the cited line moves it and nothing fails. This fails the run
      # for a line that cannot exist or holds no code, for a reference no identifier vouches for,
      # and for one whose identifier is neither at the line nor the member whose body holds it.
      - name: Check the documentation's line references still exist
        run: python3 .github/scripts/audit/check_doc_references.py

      # The concepts answer neighbouring questions, so a rule written into one of them is invisible
      # to the others. After a context compaction the next pass reads whichever file it opens first,
      # and a concept nobody points at ages out of use without anything failing. This checks the two
      # things a script can check: that every reference resolves, and which concepts are unreachable.
      - name: Check the concept documents still reference each other
        run: python3 .github/scripts/audit/check_concept_links.py

      # A concept naming an identifier the tree does not have describes a tree that does not exist.
      # `DataCenter.AggroedMembers` was such a name - the field is TargetedPartyMembers - and the
      # next pass looks for the wrong name, finds nothing and concludes the block is missing.
      # Reported, never failed: a removed or proposed name is legitimate and says so in its line.
      - name: Check the identifiers named in the concepts exist
        run: python3 .github/scripts/audit/check_concept_identifiers.py

      # A document that states "default off" about a setting the code ships as on is worse than one
      # that says nothing: the next pass reads it and recommends switching on what was on all along.
      # That has happened here once. Nothing fails when it does - the sentence stays readable.
      - name: Check the stated defaults still match the code
        run: python3 .github/scripts/audit/check_concept_defaults.py

      # A release text that names a setting by a text no setting has sends the reader to look for something the
      # settings window does not show; the description of 7.5.7.6+wsh1 did that (A333).
      - name: Check the setting names quoted in the release texts
        run: python3 .github/scripts/audit/check_setting_names.py

      # BossModUpdater casts BossModReborn's IPC integers into RSR's copies of its enums; no compiler ties the two
      # orders. A member BossModReborn inserts would turn a raidwide into a tankbuster here (A362).
      - name: Check the BossModReborn enum contract against its source
        run: python3 .github/scripts/audit/check_bmr_contract.py

      # A marker path decides whom the hit reaches by its kind: a stack everyone who stacks, a spread only the member
      # it sits on. M9's spread stood in the stack list too and opened every self-only protection for a spread on
      # someone else (A394); upstream added it to both lists in one commit.
      - name: Check every marker path belongs to one kind
        run: python3 .github/scripts/audit/check_marker_lists.py

      # A concept laid out as the loop that produced it (Antithesen, Falsifikation, Abgleich), or carrying
      # its own history in headings (Befunde, "(A238)", dates), keeps the state of the day it was written
      # beside the current one; and one subject twice under one parent is two places, one of which ages.
      # CLAUDE.md forbids all three; this fails on them.
      - name: Check the concepts are built to their rules
        run: python3 .github/scripts/audit/check_concept_structure.py --strict

      # CLAUDE.md holds what applies in every situation and loads whole into every session; the rest lies once in
      # .claude/rules (loaded when a matching file is touched) and .claude/skills, each named in CLAUDE.md's reading
      # table. A file the table does not name, a path rule that matches nothing or a rule in two files is lost or
      # ages in one place without anything failing.
      - name: Check the rule files against CLAUDE.md's reading table
        run: python3 .github/scripts/audit/check_rule_files.py

      # The archive is read by entry through archive.py, and every session starts with session_brief.py from the
      # SessionStart hook. Both parse files whose layout can drift; a parser that finds nothing answers with silence.
      - name: Check the archive parser against constructed defects
        run: python3 .github/scripts/audit/archive.py --self-test

      - name: Check the archive parses whole, its table of revocations unbroken
        run: python3 .github/scripts/audit/archive.py recent 1

      - name: Check the session brief still finds the open TODO items
        run: python3 .github/scripts/audit/session_brief.py --no-sync

      # Two hooks hold rules the text alone did not: rule_inject.py gives a rule file to a shell command that names a
      # path of its occasion, since the shell loads none (A423); stop_check.py hands an announcement or an English
      # final message back before the turn ends. Each is tried against constructed inputs.
      - name: Check the hooks read their input without waiting on a silent pipe
        run: python3 .github/scripts/audit/hook_io.py --self-test

      - name: Check the rule hook for shell commands against constructed commands
        run: python3 .github/scripts/audit/rule_inject.py --self-test

      - name: Check the stop hook against constructed final messages
        run: python3 .github/scripts/audit/stop_check.py --self-test

      - name: Check every Markdown table has its header and delimiter row
        run: python3 .github/scripts/audit/check_md_tables.py

      - name: Check TODO.md holds open work only
        run: python3 .github/scripts/audit/check_todo_open.py

      # The measuring tool for heals over time reads his ACT logs, which are not in the repository; only its reading
      # is tried here, against constructed log lines (A430).
      - name: Check the heal-over-time measuring tool against constructed log lines
        run: python3 .github/scripts/audit/act_heal_need.py --self-test

      # A release describes what changed, so its text has to start over after every release. It
      # does not do that by itself: the file still parses and still publishes, and the next
      # release would carry the previous one's text with the new part appended - the cumulative
      # document the rule replaced. The heading's base tag is measured against the newest tag on
      # origin, which is the one thing that says whether the text has aged out of its purpose.
      - name: Check the release description describes the next release
        run: python3 .github/scripts/audit/check_release_note.py

      # ---- 4. The repository: identities and the version the fork claims (the remote is fetched in 0).

      # Second line behind .githooks/pre-commit, for a clone that has no core.hooksPath set. Six
      # commits went out carrying the owner's real name and his private address in this public
      # repository, and GitHub's own "block pushes that expose my email" did not stop them: it
      # only recognises addresses listed on the pushing account, and that one was not. Reporting
      # here is late - a commit is permanent - but it names them while the number is small.
      # It needs upstream/main, fetched in the step above, to tell the fork's commits from
      # upstream's.
      - name: Check the commit identities
        run: python3 .github/scripts/audit/check_commit_identity.py

      # The version literals in Directory.Build.props name the upstream release the code contains.
      # Nothing updates them on a merge - upstream carries no version in its source tree - so they
      # age silently, and that number is what the settings window shows the user. It said 7.5.6.1
      # after upstream 7.5.6.2 had already been merged in.
      #
      # --require-tags turns "no tag found" from a pass into a failure. Without it the check would
      # wave the run through in exactly the situation it cannot answer, which is worse than not
      # checking: a silent pass is indistinguishable from a clean tree.
      - name: Check the fork version names the upstream release it sits on
        run: python3 .github/scripts/audit/check_fork_version.py --require-tags

      # ---- 5. The models (concepts 04, 09, 12 and 14). They read no plugin code: each simulates the rules it was written
      # from and holds its own invariants and self-test against constructed defects. A run therefore says something
      # new only when the model itself changed - and on every push the tankbuster model alone took 5:37 of the
      # job's 6:54 (run of 17.10.2026, A323). Each runs when its own script changed in this push, and all of them
      # on a manual run or when the previous head is unknown (a new pull request, a force push).
      - name: Run the models whose script changed
        shell: bash
        run: |
          MODELS="smn_phase_potency searing_light_coverage tankbuster_model machinist_balance_model samurai_balance_model monk_balance_model melee_gapcloser_model damage_area_model party_ttk_model tank_pull_defense_model dot_hot_model learned_revision_model learned_store_model"
          before="${{ github.event.before }}"
          after="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${{ github.event_name }}" != "pull_request" ] || [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed="all"
          else
            changed="$(git diff --name-only "$before" "$after" -- .github/scripts/audit/)"
          fi
          for model in $MODELS; do
            if [ "$changed" = "all" ] || printf '%s\n' "$changed" | grep -qx ".github/scripts/audit/$model.py"; then
              python3 ".github/scripts/audit/$model.py"
            else
              echo "$model.py unchanged in this push - not run"
            fi
          done

  Build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        # Same track as publish.yaml, always. Upstream moved the release build to the
        # staging channel in 7.5.6.0 and back to the release channel in the Beastmaster
        # commit; this line follows, because a check against a different channel than the
        # release builds against no longer measures what is shipped.
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore NuGet Packages
        run: dotnet restore RotationSolver/RotationSolver.csproj

      # A member Dalamud, ClientStructs or ECommons marks [Obsolete] has often changed meaning, not
      # just name: SMNGauge.Attunement became a bit field in 7.01 and was read as a plain number
      # until upstream switched after a Dalamud update. The compiler says so as CS0618/CS0612, and a
      # warning in a green run is read by nobody, so here - and only here, not in the projects, where
      # it would stop the owner's own build on the next Dalamud release - it fails the check.
      # Self-test first: a probe that calls an obsolete member must fail with the same switch, or a
      # clean run below would not tell a tree without obsolete use from a switch that does nothing.
      - name: Self-test the obsolete-use switch
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'obsolete-probe'
          New-Item -ItemType Directory -Force $probe | Out-Null
          Set-Content (Join-Path $probe 'Probe.csproj') '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework><OutputType>Library</OutputType></PropertyGroup></Project>'
          Set-Content (Join-Path $probe 'Probe.cs') 'public static class P { [System.Obsolete("probe")] public static void Old() { } [System.Obsolete] public static void Bare() { } public static void Use() { Old(); Bare(); } }'
          # Without the switch the probe must build - otherwise a failure below could come from
          # anything (restore, SDK) and prove nothing about the switch.
          dotnet build $probe | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'The probe does not build even without the switch; the self-test measures nothing.' }
          $out = dotnet build $probe --no-incremental -warnaserror:CS0618,CS0612 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -eq 0) { throw 'The obsolete-use switch let a call to an [Obsolete] member through.' }
          foreach ($code in 'CS0618', 'CS0612') {
            if ($out -notmatch "error $code") { throw "The probe failed, but not with error $code." }
          }
          $global:LASTEXITCODE = 0

      # The projects ban LINQ through BannedSymbols.txt, found as $(SolutionDir)BannedSymbols.txt. The
      # owner builds the solution, where SolutionDir is set; this job builds a project, where it is empty,
      # the list is not found, and the analyzer bans nothing - so a LINQ call reached the owner's build
      # as RS0030 while every run here stayed clean (A250). SolutionDir is passed explicitly, and RS0030
      # fails the check like an obsolete call. The self-test wires a probe exactly like the projects and
      # builds it with the same arguments: if the list is not found, the probe builds and the step fails.
      - name: Self-test the banned-API switch
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'banned-probe'
          New-Item -ItemType Directory -Force $probe | Out-Null
          Set-Content (Join-Path $probe 'Probe.csproj') '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework><OutputType>Library</OutputType></PropertyGroup><ItemGroup><PackageReference Include="Microsoft.CodeAnalysis.BannedApiAnalyzers" Version="5.6.0"><PrivateAssets>all</PrivateAssets><IncludeAssets>runtime; build; native; contentfiles; analyzers; buildtransitive</IncludeAssets></PackageReference><AdditionalFiles Include="$(SolutionDir)BannedSymbols.txt" /></ItemGroup></Project>'
          Set-Content (Join-Path $probe 'Probe.cs') 'public static class P { public static int First(int[] a) => System.Linq.Enumerable.FirstOrDefault(a); }'
          dotnet build $probe | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'The probe does not build even without the switch; the self-test measures nothing.' }
          $out = dotnet build $probe --no-incremental "-p:SolutionDir=$env:GITHUB_WORKSPACE/" -warnaserror:RS0030 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -eq 0) { throw 'The banned-API switch let a LINQ call through: BannedSymbols.txt was not found or RS0030 did not fail.' }
          if ($out -notmatch 'error RS0030') { throw 'The probe failed, but not with error RS0030.' }
          $global:LASTEXITCODE = 0

      # The XML documentation is part of what derived rotations read, and its warnings went unread here
      # as well: a cref that named two overloads (CS0419, A230) and a record whose doc comment covered four
      # of nine parameters (CS1573, A282) both reached the owner's own build. The documentation codes fail
      # the check like an obsolete call. The probe raises each listed code once, so a code missing from the
      # switch, or a probe that writes no documentation, fails this step.
      - name: Self-test the documentation switch
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'doc-probe'
          New-Item -ItemType Directory -Force $probe | Out-Null
          Set-Content (Join-Path $probe 'Probe.csproj') '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework><OutputType>Library</OutputType><GenerateDocumentationFile>true</GenerateDocumentationFile><NoWarn>CS1591</NoWarn></PropertyGroup></Project>'
          Set-Content (Join-Path $probe 'Probe.cs') @(
            'public static class P',
            '{',
            '    /// <summary>Missing one, CS1573.</summary>',
            '    /// <param name="a">a</param>',
            '    public static void Missing(int a, int b) { }',
            '    /// <summary>No such parameter, CS1572.</summary>',
            '    /// <param name="z">z</param>',
            '    public static void Unknown() { }',
            '    /// <summary>Twice, CS1571.</summary>',
            '    /// <param name="a">a</param>',
            '    /// <param name="a">again</param>',
            '    public static void Twice(int a) { }',
            '    /// <summary>Unresolved, CS1574: <see cref="Nowhere"/>; paramref, CS1734: <paramref name="q"/></summary>',
            '    public static void Refs() { }',
            '    /// <summary>Ambiguous, CS0419: <see cref="Over"/></summary>',
            '    public static void Ambiguous() { }',
            '    /// <summary>One.</summary>',
            '    public static void Over(int a) { }',
            '    /// <summary>Two.</summary>',
            '    public static void Over(string a) { }',
            '    /// <summary>Badly formed, CS1570.</sumary>',
            '    public static void Broken() { }',
            '}')
          dotnet build $probe | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'The probe does not build even without the switch; the self-test measures nothing.' }
          $out = dotnet build $probe --no-incremental -warnaserror:CS0419,CS1570,CS1571,CS1572,CS1573,CS1574,CS1734 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -eq 0) { throw 'The documentation switch let a broken doc comment through.' }
          foreach ($code in 'CS0419', 'CS1570', 'CS1571', 'CS1572', 'CS1573', 'CS1574', 'CS1734') {
            if ($out -notmatch "error $code") { throw "The probe failed, but not with error $code." }
          }
          $global:LASTEXITCODE = 0

      - name: Build Plugin
        run: dotnet build --no-restore -c Release RotationSolver/RotationSolver.csproj "-p:SolutionDir=$env:GITHUB_WORKSPACE/" -warnaserror:CS0618,CS0612,RS0030,CS0419,CS1570,CS1571,CS1572,CS1573,CS1574,CS1734

      # DefenseTrace.log names the commit it was written by, so an uploaded trace can be matched to
      # its code. The commit comes from a git call in Directory.Build.props; if that call fails the
      # build still succeeds and the trace says "unknown". This step makes the failure visible: the
      # generated assembly info has to carry exactly the commit that was checked out.
      - name: Check the build names its commit
        run: |
          $expected = git rev-parse --short=9 HEAD
          $info = Get-ChildItem RotationSolver/obj -Recurse -Filter 'RotationSolver.AssemblyInfo.cs' | Select-Object -First 1
          if (-not $info) { throw 'No generated assembly info found for RotationSolver.' }
          $text = Get-Content $info.FullName -Raw
          if ($text -notmatch "AssemblyMetadataAttribute\(`"SourceCommit`", `"$expected`"\)") {
            Write-Host $text
            throw "RotationSolver.dll does not name commit $expected."
          }
          Write-Host "RotationSolver.dll names commit $expected."

      # The generator is in the solution and in no build. Nothing referenced it, so a compile error
      # in it reached the user instead of the CI - a missing `using Lumina` for LuminaOptions did
      # exactly that. It needs the game files to *run*, not to compile, so building it here costs a
      # restore and closes the gap for every future change to it.
      - name: Build the game-data generator
