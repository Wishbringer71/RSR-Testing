name: Build
on:
  pull_request:
    branches:
      - main
jobs:
  DispatchChain:
    # Separate from Build: needs no .NET and no Dalamud, so it reports in
    # seconds instead of waiting on the full Windows build.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Check base call targets
        run: python3 .github/scripts/check_base_calls.py

      # Fails when a barrier whose PvE action creates one is missing from ShieldStatus. That list
      # ages by omission: an unlisted barrier counts as none at all, so the gap is invisible in the
      # code and only shows as a healer topping up a target that was already covered.
      - name: Check ShieldStatus covers every PvE barrier
        run: python3 .github/scripts/audit/scan13.py

  Build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        # Same track as publish.yaml. Upstream moved the release build to the staging
        # channel in 7.5.6.0 - the only change that release carries - so a check against
        # the release channel would no longer compile what a release actually builds.
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore NuGet Packages
        run: dotnet restore RotationSolver/RotationSolver.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release RotationSolver/RotationSolver.csproj
